<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login - Oficina AutoCerta</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="login-wrap">
    <div class="login-card">
        <h1>Oficina AutoCerta</h1>
        <p class="sub">Entre com seu usuário e senha.</p>

        <form id="form-login">
            <label for="login">Usuário</label>
            <input type="text" id="login" autocomplete="username">

            <label for="senha">Senha</label>
            <input type="password" id="senha" autocomplete="current-password">

            <div class="erro-box" id="erro"></div>
            <button type="submit">Entrar</button>
        </form>

        <div class="dica">Teste: <b>admin / admin123</b> &middot; <b>ana.mecanica / ana123</b> &middot; <b>carlos.recepcao / carlos123</b></div>
    </div>
</div>
<script src="js/comum.js"></script>
<script src="js/login.js"></script>
</body>
</html>
